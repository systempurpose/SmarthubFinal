<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartHub – Android Diagnostic Tool</title>
    <link rel="stylesheet" href="../css/ui.css">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar (Windows 11 Fluent Design) -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <i class="fas fa-microchip"></i>
                <h2>SmartHub</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active" data-page="dashboard">
                    <i class="fas fa-tachometer-alt"></i> Dashboard
                </a>
                <a href="#" class="nav-item" data-page="device-info">
                    <i class="fas fa-mobile-alt"></i> Device Info
                </a>
                <a href="#" class="nav-item" data-page="hardware-tests">
                    <i class="fas fa-microscope"></i> Hardware Tests
                </a>
              <a href="#" class="nav-item" data-page="connection-troubleshoot">
    <i class="fas fa-globe"></i> Connection Troubleshoot
</a>
                <a href="#" class="nav-item" data-page="ai-conclusion">
    <i class="fas fa-robot"></i> AI Conclusion
</a>
                <a href="#" class="nav-item" data-page="repairs">
                    <i class="fas fa-tools"></i> Repairs
                </a>
             <a href="#" class="nav-item" data-page="bsod">
    <i class="fas fa-exclamation-triangle"></i> BSOD Diagnosis
</a>
            </nav>
            <div class="sidebar-footer">
                <div class="connection-status" id="connectionStatus">
                    <i class="fas fa-plug"></i> <span>Disconnected</span>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <div id="pageContent" class="page-content">
                <!-- Dynamic content injected by JS -->
                <div class="loader">Loading dashboard...</div>
            </div>
        </main>
    </div>

    <!-- Modal: USB Debugging Wizard (No-USB-Debugging Triage) -->
    <div id="wizardModal" class="modal">
        <div class="modal-content acrylic">
            <div class="modal-header">
                <h3><i class="fas fa-exclamation-triangle"></i> No USB Debugging? Let's Fix It</h3>
                <span class="close-button">&times;</span>
            </div>
            <div class="modal-body" id="wizardBody">
                <!-- Steps injected dynamically -->
            </div>
            <div class="modal-footer">
                <button id="wizardPrevBtn" class="btn-secondary" disabled>Previous</button>
                <button id="wizardNextBtn" class="btn-primary">Next</button>
                <button id="wizardCancelBtn" class="btn-secondary">Cancel</button>
            </div>
        </div>
    </div>

    <script src="../js/ui.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartHub – Android Diagnostic Tool</title>
    <link rel="stylesheet" href="../css/ui.css">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar (Windows 11 Fluent Design) -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <i class="fas fa-microchip"></i>
                <h2>SmartHub</h2>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="nav-item active" data-page="dashboard">
                    <i class="fas fa-tachometer-alt"></i> Dashboard
                </a>
                <a href="#" class="nav-item" data-page="device-info">
                    <i class="fas fa-mobile-alt"></i> Device Info
                </a>
                <a href="#" class="nav-item" data-page="hardware-tests">
                    <i class="fas fa-microscope"></i> Hardware Tests
                </a>
                <a href="#" class="nav-item" data-page="connection-troubleshoot">
                    <i class="fas fa-globe"></i> Connection Troubleshoot
                </a>
                <a href="#" class="nav-item" data-page="ai-conclusion">
                    <i class="fas fa-robot"></i> AI Conclusion
                </a>
                <a href="#" class="nav-item" data-page="repairs">
                    <i class="fas fa-tools"></i> Repairs
                </a>
                <a href="#" class="nav-item" data-page="bsod">
                    <i class="fas fa-exclamation-triangle"></i> BSOD Diagnosis
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="connection-status" id="connectionStatus">
                    <i class="fas fa-plug"></i> <span>Disconnected</span>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Device Info Card (button removed) -->
            <div id="device-info-card" style="display: flex; align-items: center; gap: 16px; background: white; padding: 16px 20px; border-radius: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px;">
                <div id="brand-icon" style="font-size: 48px; width: 60px; text-align: center;">
                    <i class="fas fa-mobile-alt" style="color: #6B7280;"></i>
                </div>
                <div style="flex: 1;">
                    <div style="display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;">
                        <span id="device-model" style="font-size: 20px; font-weight: 600;">Device</span>
                        <span id="device-brand" style="font-size: 14px; color: #6B7280;"></span>
                    </div>
                    <div style="display: flex; gap: 16px; margin-top: 4px; flex-wrap: wrap;">
                        <span id="device-android" style="font-size: 13px; color: #6B7280;">Android</span>
                        <span id="device-resolution" style="font-size: 13px; color: #6B7280;"></span>
                        <span id="device-battery-summary" style="font-size: 13px; color: #6B7280;">🔋 --%</span>
                    </div>
                </div>
                <!-- The extra Deep Diagnostic button has been removed. -->
            </div>

            <!-- Status Bar -->
            <div id="status-bar" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 20px;">
                <div class="status-card" style="background: white; padding: 12px 16px; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.06);">
                    <div style="font-size: 12px; color: #6B7280;">Battery</div>
                    <div style="font-size: 20px; font-weight: 600;" id="status-battery">--%</div>
                    <div style="width: 100%; height: 4px; background: #E5E7EB; border-radius: 2px; margin-top: 4px;"><div id="status-battery-bar" style="height: 4px; background: #10B981; border-radius: 2px; width: 0%;"></div></div>
                </div>
                <div class="status-card" style="background: white; padding: 12px 16px; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.06);">
                    <div style="font-size: 12px; color: #6B7280;">Storage</div>
                    <div style="font-size: 20px; font-weight: 600;" id="status-storage">--%</div>
                    <div style="width: 100%; height: 4px; background: #E5E7EB; border-radius: 2px; margin-top: 4px;"><div id="status-storage-bar" style="height: 4px; background: #3B82F6; border-radius: 2px; width: 0%;"></div></div>
                </div>
                <div class="status-card" style="background: white; padding: 12px 16px; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.06);">
                    <div style="font-size: 12px; color: #6B7280;">RAM</div>
                    <div style="font-size: 20px; font-weight: 600;" id="status-ram">--%</div>
                    <div style="width: 100%; height: 4px; background: #E5E7EB; border-radius: 2px; margin-top: 4px;"><div id="status-ram-bar" style="height: 4px; background: #8B5CF6; border-radius: 2px; width: 0%;"></div></div>
                </div>
                <div class="status-card" style="background: white; padding: 12px 16px; border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,0.06);">
                    <div style="font-size: 12px; color: #6B7280;">Security</div>
                    <div style="font-size: 20px; font-weight: 600;" id="status-security">✅</div>
                    <div style="font-size: 11px; color: #6B7280;" id="status-security-text">No threats</div>
                </div>
            </div>

            <!-- Dynamic Page Content -->
            <div id="pageContent" class="page-content">
                <!-- JS will inject dashboard or other pages here -->
                <div class="loader">Loading dashboard...</div>
            </div>
        </main>
    </div>

    <!-- Modal: USB Debugging Wizard -->
    <div id="wizardModal" class="modal">
        <div class="modal-content acrylic">
            <div class="modal-header">
                <h3><i class="fas fa-exclamation-triangle"></i> No USB Debugging? Let's Fix It</h3>
                <span class="close-button">&times;</span>
            </div>
            <div class="modal-body" id="wizardBody">
                <!-- Steps injected dynamically -->
            </div>
            <div class="modal-footer">
                <button id="wizardPrevBtn" class="btn-secondary" disabled>Previous</button>
                <button id="wizardNextBtn" class="btn-primary">Next</button>
                <button id="wizardCancelBtn" class="btn-secondary">Cancel</button>
            </div>
        </div>
    </div>

    <script src="../js/ui.js"></script>
</body>
</html>
